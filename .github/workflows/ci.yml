name: Python checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Check Python lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run complete test suite and report coverage
        run: python -m pytest -q --cov=. --cov-report=term-missing
